name: Python lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Check Python defaults
        run: uvx --python 3.14 no-defaults@2026.9.1 --private-only multi_repo.py
